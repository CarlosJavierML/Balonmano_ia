# Deploys the app to a Hugging Face Space (Docker Spaces need the HF PRO plan
# since July 2026; the workflow is skipped until HF_SPACE is configured).
#
# One-time setup (see docs/DEPLOY.md):
#   1. Create a Space at https://huggingface.co/new-space with SDK "Docker".
#   2. In this GitHub repo, Settings > Secrets and variables > Actions:
#        - secret   HF_TOKEN        : a Hugging Face token with "write" access
#        - variable HF_SPACE        : "<hf-user>/<space-name>"
#        - variable DEPLOY_BRANCH   : (optional) branch to deploy; defaults to
#                                     the repository's default branch
#   3. In the Space settings, add the secret BALONMANO_ACCESS_PASSWORD.
#
# Then every push to the deploy branch updates the Space, which rebuilds the
# Dockerfile at the repo root.
name: Deploy to Hugging Face Space

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref_name == (vars.DEPLOY_BRANCH || github.event.repository.default_branch))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Space repository
        run: |
          mkdir /tmp/space
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t /tmp/space
          # A Space is configured by the YAML header of its README.
          {
            printf -- '---\n'
            printf 'title: Balonmano IA\n'
            printf 'emoji: 🤾\n'
            printf 'colorFrom: green\n'
            printf 'colorTo: blue\n'
            printf 'sdk: docker\n'
            printf 'app_port: 7860\n'
            printf 'pinned: false\n'
            printf -- '---\n\n'
            cat README.md
          } > /tmp/space/README.md

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "::error::Falta el secreto HF_TOKEN"; exit 1; }
          cd /tmp/space
          git init -q -b main
          git config user.email "deploy@github-actions"
          git config user.name "GitHub Actions"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Desplegado en https://huggingface.co/spaces/${HF_SPACE}" >> "$GITHUB_STEP_SUMMARY"
